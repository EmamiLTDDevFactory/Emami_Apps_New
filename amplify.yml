version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "EXPO_PUBLIC_AUTH_API_URL=$EXPO_PUBLIC_AUTH_API_URL" > .env
        - echo "EXPO_PUBLIC_ACCESS_API_URL=$EXPO_PUBLIC_ACCESS_API_URL" >> .env
        - echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" > embedded-apps/non-ctc-expense/.env
        - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > embedded-apps/rc-portal/.env
        - npm run build:web
        - npm run build:embedded
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
